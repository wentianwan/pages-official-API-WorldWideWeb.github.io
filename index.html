ms:center;justify-content:center;opacity:0;visibility:hidden}.modal.active{opacity:1;visibility:visible}.modal-box{background:#fff;width:90%;max-width:680px;border-radius:8px;display:flex;flex-direction:column;transform:scale(.95);transition:.2s}.modal-header{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between}.modal-close{background:none;border:none;font-size:24px;color:#999;cursor:pointer}.modal-body{padding:20px;overflow-y:auto;flex:1}.img-grid{display:flex;flex-wrap:wrap;gap:8px}.img-grid img{width:100%;height:auto;border-radius:4px;cursor:pointer}.html-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:center}.html-modal.active{opacity:1;visibility:visible}.html-modal-box{width:92vw;max-width:900px;height:85vh;border-radius:8px;overflow:hidden}.html-modal-body{flex:1;overflow:auto}.html-modal-body *{-webkit-user-select:text!important;-khtml-user-select:text!important;-moz-user-select:text!important;-ms-user-select:text!important;user-select:text!important}.html-modal-body iframe{width:100%;height:100%;border:none}.show-html-btn{display:block;margin:0 auto 16px;padding:10px 0;width:100%;max-width:220px;background:#4a9eff;color:#fff;border-radius:6px;font-size:15px;text-align:center}.show-html-btn:active{background:#3a8eef}.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:400;display:flex}.img-modal img{max-width:95%;max-height:95%;object-fit:contain}.loading{padding:40px;text-align:center}.pager{display:flex;justify-content:center;padding:15px}.pager button{padding:8px 16px;background:#4a9eff;color:#fff;border-radius:4px;cursor:pointer}.yo-search{display:flex;gap:8px;margin-bottom:12px}.yo-search input{flex:1;padding:8px;border:1px solid #ddd;border-radius:4px}.yo-search button{padding:8px 16px;background:#4a9eff;color:#fff;border-radius:4px}.err{color:#e53e3e;text-align:center;padding:30px}</style><script>const cfg={},data={},cur="api",yoPage=1,yoCache=[],refreshCount=parseInt(sessionStorage.getItem('refreshCount')||'0'),timeStamp=Date.now();sessionStorage.setItem('refreshCount',refreshCount+1);if(refreshCount>=3){caches.keys().then(keys=>keys.forEach(key=>caches.delete(key)));localStorage.clear();sessionStorage.clear();sessionStorage.setItem('refreshCount','1');}window.addEventListener('beforeunload',()=>{caches.keys().then(keys=>keys.forEach(key=>caches.delete(key)));localStorage.clear();sessionStorage.clear();});document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("selectstart",e=>e.preventDefault());document.addEventListener("copy",e=>e.preventDefault());document.addEventListener("cut",e=>e.preventDefault());document.addEventListener("keydown",e=>{if([123,32].includes(e.keyCode)||e.ctrlKey&&!e.altKey&&!e.metaKey)return false;});Object.defineProperty(document,"hidden",{get:()=>false});setInterval(()=>{if(window.outerHeight>document.body.clientHeight||window.outerWidth>document.body.clientWidth)window.location.replace("http://www.tianbin.net");},2000);setInterval(()=>{console.clear();Object.defineProperty(console,"log",{value:()=>{}});},500);function fetchAPI(url,t=timeStamp){return fetch(url+`?t=${t}`,{cache:"no-store"}).then(r=>r.json());}function loadConfig(){fetchAPI("https://api.tianbin.org/api/index.json").then(j=>{cfg.sections=j.sections;document.title=j.siteName;renderNav();const hash=location.hash.slice(1);cur=cfg.sections.find(s=>s.id===hash)?.id||j.start||"api";updateActive();loadData(cur);}).catch(_=>{setTimeout(loadConfig,1000);});}function renderNav(){const mbNav=document.querySelector(".mobile-nav");mbNav.innerHTML=cfg.sections.map(s=>`<button data-id="${s.id}" class="${cur===s.id?'active':''}"><span>${s.icon}</span>${s.name}</button>`).join("");mbNav.onclick=e=>{const id=e.target.closest("button")?.dataset.id;if(id&&!id===cur){cur=id;history.replaceState(null,"",`#${id}`);loadData(id);}};}function updateActive(){document.querySelectorAll(".mobile-nav button").forEach(btn=>btn.classList.toggle("active",btn.dataset.id===cur));document.querySelector(".mobile-header").textContent=(cfg.sections.find(s=>s.id===cur)||{}).name||"";}function loadData(id){const area=document.querySelector(".content-area");area.innerHTML="<div class=\"loading\">数据加载中...</div>";if(id==="yo"){fetchAPI("https://api.tianbin.org/api/yo.json").then(j=>{yoCache=j.sort((a,b)=>new Date(b.date)-new Date(a.date));renderYoList();}).catch(_=>setTimeout(()=>loadData(id),1000));}else{fetchAPI(`https://api.tianbin.org/api/${id}.json`).then(j=>renderList(j)).catch(_=>setTimeout(()=>loadData(id),1000));}}function renderYoList(){const area=document.querySelector(".content-area"),start=(yoPage-1)*5;area.innerHTML=yoCache.slice(start,start+5).map((it,i)=>`<div class="list-item" onclick="openModal(${start+i})"><div class="title">${it.title}</div><div class="meta">${it.date} · ${it.author}</div></div>`).join("")+"<div class='pager'><button onclick='yoPage>1&&loadData(\"yo\")'>返回</button></div>";}function renderList(items){document.querySelector(".content-area").innerHTML=items.map((it,i)=>`<div class="list-item" onclick="openModal(${i})">${it.title}<br>${it.date}</div>`).join("");}function openModal(idx){const item=cur==="yo"?yoCache[idx]:data[cur][idx];document.querySelector(".modal .modal-body").innerHTML=`<div>${item.content}</div>`;document.querySelector(".modal-header h3").textContent=item.title;document.querySelector(".modal").classList.add("active");}window.addEventListener("DOMContentLoaded",loadConfig);document.querySelectorAll("button").forEach(btn=>{btn.style.cursor="pointer";btn.addEventListener("click",()=>{btn.style.transform="scale(0.95)";setTimeout(()=>btn.style.transform="scale(1)",150);});});Object.defineProperty(window,"outerHeight",{get:()=>window.innerHeight});Object.defineProperty(window,"outerWidth",{get:()=>window.innerWidth});</script></head><body><div id="app"><header class="mobile-header"></header><div class="main-content"><div class="content-area"></div
