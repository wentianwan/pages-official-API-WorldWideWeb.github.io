function buildSearchIndex(sid){const list=cacheAll[sid]||[];const fields=getSearchFields(sid);searchIndex[sid]=list.map((item,idx)=>{let text="";fields.forEach(f=>{text+=(item[f]||"")+" "});return{idx,text:text.toLowerCase(),item}});}
function weightedSearch(sid,query){if(!searchIndex[sid])buildSearchIndex(sid);const q=query.toLowerCase();const fields=getSearchFields(sid);const results=searchIndex[sid].map(entry=>{let score=0;const item=entry.item;fields.forEach((f,i)=>{const val=(item[f]||"").toLowerCase();if(val===q)score+=100-i*10;else if(val.indexOf(q)>=0)score+=50-i*5;const words=q.split(/\s+/);words.forEach(w=>{if(val.indexOf(w)>=0)score+=10-i});});return{entry,score}}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);return results.map(r=>r.entry.item);}
function simpleSearch(sid,query){const fields=getSearchFields(sid);const q=query.toLowerCase();return(cacheAll[sid]||[]).filter(it=>fields.some(f=>{const v=(it[f]||"").toLowerCase();return v.indexOf(q)>=0}));}
function highlightText(text,query){if(!query)return text;const words=query.split(/\s+/).filter(w=>w.length>0);let result=text;words.forEach(w=>{const regex=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');result=result.replace(regex,'<mark>$&</mark>');});return result;}
function renderCanvasWatermark(){let canvas=$('#watermark-canvas');if(!canvas){canvas=document.createElement('canvas');canvas.id='watermark-canvas';document.body.appendChild(canvas);}const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;ctx.clearRect(0,0,canvas.width,canvas.height);const text=(cfg.security&&cfg.security.watermarkText)||'天彬TianBIN';ctx.font='14px -apple-system,sans-serif';ctx.fillStyle='#4a9eff';ctx.globalAlpha=0.5;for(let i=0;i<30;i++){ctx.save();ctx.translate(Math.random()*canvas.width,Math.random()*canvas.height);ctx.rotate(-Math.PI/6);ctx.fillText(text,0,0);ctx.restore();}ctx.globalAlpha=1;}
function preloadAll(){if(!cfg.sections)return;Object.keys(cfg.sections).forEach(s=>{if(s===cur)return;enqueueRequest(()=>fetchWithTimeout((cfg.apiBase||"https://api.tianbin.org/api/")+cfg.sections[s].api+"?_="+Date.now(),cfg.behavior&&cfg.behavior.requestTimeout||1000).then(r=>r.json()).then(j=>{cacheAll[s]=j;if(getSortBy(s)==="date"){cacheAll[s].sort((a,b)=>{const da=new Date(a.date),db=new Date(b.date);return getSortOrder(s)==="desc"?db-da:da-db;});}emit('data:loaded',{sid:s});}).catch(()=>{})).catch(()=>{});});}
function scheduleIdlePreload(){if(idleScheduled)return;idleScheduled=true;if('requestIdleCallback' in window){requestIdleCallback(()=>{idleScheduled=false;const keys=Object.keys(cfg.sections||{});const unloaded=keys.filter(k=>!cacheAll[k]&&k!==cur);if(unloaded.length>0){const next=unloaded[0];enqueueRequest(()=>fetchWithTimeout((cfg.apiBase||"https://api.tianbin.org/api/")+cfg.sections[next].api+"?_="+Date.now()).then(r=>r.json()).then(j=>{cacheAll[next]=j;}).catch(()=>{}),PRIORITY.LOW);}}});}
function loadConfig(){mark('configStart');return enqueueRequest(()=>fetchWithTimeout(CONFIG_URL+"?_="+Date.now()).then(r=>{if(!r.ok)throw new Error("config load failed "+r.status);return r.json();}).then(j=>{cfg=j;retryCount=0;mark('configLoaded');document.title=j.siteName;if(cfg.security&&cfg.security.watermark){renderCanvasWatermark();}const params=new URLSearchParams(location.search);const initTab=params.get('tab')||(location.hash.slice(1).split('/')[0]);cur=initTab&&cfg.sections&&cfg.sections[initTab]?initTab:j.homeId||Object.keys(j.sections||{})[0]||'home';if(params.get('page')){ensurePageState(cur).page=parseInt(params.get('page'))||1;}if(params.get('q')){state.searchQuery=params.get('q');}renderNav();updateActive();loadData(cur);preloadAll();emit('config:loaded',cfg);}).catch(err=>{retryCount++;const area=$('.content-area');if(area)area.innerHTML='<div class="loading">拉取配置中…<span class="loading-sub">('+retryCount+'/3)</span><div class="loading-bar"></div></div>';if(retryCount>=3){area.innerHTML='<div class="err">无法加载站点配置<br>'+CONFIG_URL+'<br>请确认接口已部署</div>';retryCount=0;}else{setTimeout(loadConfig,1000);}}))}
function renderNav(){const mbNav=$('.mobile-nav');mbNav.innerHTML=cfg.bottomNav.map((s,i)=>'<button data-id="'+s.id+'" data-index="'+i+'"><span>'+s.icon+'</span>'+s.name+(s.badge?'<i class="nav-badge" id="badge-'+s.id+'"></i>':'')+'</button>').join("");mbNav.onclick=e=>{const btn=e.target.closest("button");if(btn&&btn.dataset.id)switchTab(btn.dataset.id);};updateActive();}
function switchTab(id,fromBroadcast){state.route=id;state.scrollPos[cur]=window.scrollY||document.querySelector('.content-area').scrollTop;cur=id;const ps=ensurePageState(id);ps.page=1;ps.filtered=null;updateActive();loadData(id);window.scrollTo(0,0);history.replaceState(null,null,"#"+id);bc.postMessage({type:'tab-switch',tab:id});if(!fromBroadcast)emit('route:change',{from:cur,to:id});}
window.addEventListener("hashchange",SCHED.throttle(()=>{const hash=location.hash.slice(1).split('/')[0];if(hash&&hash!==cur&&cfg.sections&&cfg.sections[hash]){state.route=hash;cur=hash;const ps=ensurePageState(hash);ps.page=1;ps.filtered=null;updateActive();loadData(cur);emit('route:change',{from:cur,to:hash});}},200));
function updateActive(){$$(".mobile-nav button").forEach(btn=>{btn.classList.toggle("active",btn.dataset.id===cur);});const mh=$('.mobile-header');if(mh)mh.textContent=((cfg.bottomNav||[]).find(s=>s.id===cur)||{}).name||"";const ph=$('.pc-header');if(ph)ph.textContent=((cfg.bottomNav||[]).find(s=>s.id===cur)||{}).name||cfg.siteName||"";const searchBar=$('.section-search');if(searchBar){if(getSearchable(cur)){searchBar.classList.add("active");renderSearchHistory();}else{searchBar.classList.remove("active");}}}
function renderSearchHistory(){const key='searchHist_'+cur;const hist=JSON.parse(sessionStorage.getItem(key)||'[]');let histHtml=hist.length?'<div class="search-history">'+hist.map(h=>'<span onclick="applyHistory(\''+h.replace(/'/g,"\\'")+'\')">'+h+'</span>').join('')+'</div>':'';$('.section-search').innerHTML='<input id="secKey" placeholder="输入关键词查询"><button onclick="secSearch()">查询</button>'+histHtml;if(state.searchQuery){$('#secKey').value=state.searchQuery;}}
function applyHistory(q){$('#secKey').value=q;secSearch();}
function loadData(id){const area=$('.content-area');area.innerHTML='<div class="loading">拉取数据中…<span class="loading-sub">('+retryCount+'/3)</span><div class="loading-bar"></div></div>';if(cacheAll[id]){const ps=ensurePageState(id);ps.list=cacheAll[id].slice();renderCurrent();return;}enqueueRequest(()=>fetchWithTimeout((cfg.apiBase||"https://api.tianbin.org/api/")+cfg.sections[id].api+"?_="+Date.now()).then(r=>{if(!r.ok)throw new Error("data load failed "+r.status);return r.json();}).then(j=>{cacheAll[id]=j;retryCount=0;mark('dataLoaded_'+id);if(getSortBy(id)==="date"){cacheAll[id].sort((a,b)=>{const da=new Date(a.date),db=new Date(b.date);return getSortOrder(id)==="desc"?db-da:da-db;});}const ps=ensurePageState(id);ps.list=cacheAll[id].slice();renderCurrent();emit('data:loaded',{sid:id});}).catch(()=>{retryCount++;area.innerHTML='<div class="loading">拉取数据中…<span class="loading-sub">('+retryCount+'/3)</span><div class="loading-bar"></div></div>';if(retryCount>=3){area.innerHTML='<div class="err">无法加载栏目数据<br>'+id+'</div>';retryCount=0;}else{setTimeout(()=>loadData(id),1000);}}))}
function renderCurrent(){renderVersion++;const ps=ensurePageState(cur);let list=ps.filtered||ps.list;const perPage=getPerPage(cur);ps.total=Math.max(1,Math.ceil(list.length/perPage));if(ps.page>ps.total)ps.page=ps.total;const area=$('.content-area');let html='';if(getSearchable(cur)){html+='<div class="section-search active"><input id="secKey" placeholder="输入关键词查询" value="'+(state.searchQuery||'')+'"><button onclick="secSearch()">查询</button></div>';}const start=(ps.page-1)*perPage,end=Math.min(start+perPage,list.length);for(let i=start;i<end;i++){const item=list[i];html+='<div class="list-item" data-idx="'+i+'" onclick="openModal(\''+cur+'\','+i+')"><div class="title">'+(state.searchQuery?highlightText(item.title||"",state.searchQuery):(item.title||""))+'</div><div class="meta">'+(item.date||"")+' · '+(item.author||"")+'</div></div>';}html+='<div class="pager"><button onclick="secPrev()" '+(ps.page<=1?'disabled':'')+'>上一页</button><span class="page-info">'+ps.page+'/'+ps.total+'</span><button onclick="secNext()" '+(ps.page>=ps.total?'disabled':'')+'>下一页</button></div>';html+='<div class="sentinel" id="scrollSentinel"></div>';area.innerHTML=html;const sentinel=$('#scrollSentinel');if(sentinel&&'IntersectionObserver' in window){const io=new IntersectionObserver(entries=>{if(entries[0].isIntersecting){secNext();io.disconnect();}},{rootMargin:'100px'});io.observe(sentinel);}}
const debouncedSearch=SCHED.debounce(()=>{if(!getSearchable(cur))return;const k=$('#secKey').value.trim();state.searchQuery=k;const ps=ensurePageState(cur);if(!k){ps.filtered=null;ps.page=1;renderCurrent();return;}const mode=getSearchMode(cur);if(mode==="weighted"){ps.filtered=weightedSearch(cur,k);}else{ps.filtered=simpleSearch(cur,k);}ps.page=1;renderCurrent();const key='searchHist_'+cur;let hist=JSON.parse(sessionStorage.getItem(key)||'[]');if(k&&hist.indexOf(k)<0){hist.unshift(k);hist=hist.slice(0,5);sessionStorage.setItem(key,JSON.stringify(hist));}emit('search:submit',{query:k,results:ps.filtered.length});},300);
function secSearch(){debouncedSearch();}
function secPrev(){const ps=ensurePageState(cur);if(ps.page>1){ps.page--;renderCurrent();window.scrollTo(0,0);}}
function secNext(){const ps=ensurePageState(cur);if(ps.page<ps.total){ps.page++;renderCurrent();window.scrollTo(0,0);}}
let htmlRetryCount=0,htmlRetryTimer=null,htmlCurrentIdx=-1,htmlCurrentSid="",currentRawHtml='';
function openModal(sid,idx){let item=(cacheAll[sid]||[])[idx];if(!item)return;state.modalStack.push({sid,idx,type:'modal'});const modal=$('.modal');const body=$('.modal-body');let html='<div class="text">'+item.content.replace(/\n/g,"<br>").replace(/\t([^\n]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')+'</div>';if(item.imgs&&item.imgs.length){html+='<div class="img-grid">'+item.imgs.slice(0,9).map(u=>'<img src="'+u+'" onclick="openImg(\''+u+'\')">').join("")+'</div>';}if(item.html){html+='<button type="button" class="show-html-btn" onclick="openHtmlModal(\''+sid+'\','+idx+')">立即了解…</button>';}body.innerHTML=html;$('.modal-header h3').textContent=item.title||"";modal.classList.add("active");emit('modal:open',{sid,idx});}
function openHtmlModal(sid,idx){htmlCurrentSid=sid;htmlCurrentIdx=idx;let item=(cacheAll[sid]||[])[idx];if(!item)return;htmlRetryCount=0;const modal=$('.html-modal');const body=$('.html-modal-body');$('.html-modal-header h3').textContent=item.title||"详细内容HTML";let raw=item.html.replace(/¥/g,'"');currentRawHtml=raw;let ts='?_='+Date.now();let contentHtml='';if(/<iframe/i.test(raw)){contentHtml=raw.replace(/<iframe/i,'<iframe id="subIframe"').replace(/<\/iframe>/i,'</iframe>');if(contentHtml.indexOf('src="')>=0)contentHtml=contentHtml.replace(/(src="[^"]*)"/,'$1'+ts+'"');}else{contentHtml='<iframe id="subIframe" srcdoc="'+raw.replace(/"/g,'&quot;')+'" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation" style="width:100%;height:100%;border:none;display:block;"></iframe>';}contentHtml+='<button type="button" class="html-reload-btn" onclick="reloadSubFrame()">↻</button>';body.innerHTML=contentHtml;body.querySelectorAll('a').forEach(a=>{a.setAttribute('target','_top');a.setAttribute('rel','noopener noreferrer');});body.querySelectorAll('form').forEach(f=>{f.setAttribute('target','_top');});const iframe=$('#subIframe');if(iframe){iframe.onload=()=>{htmlRetryCount=0;};iframe.onerror=()=>{subFrameRetry();};}modal.classList.add("active");subFrameRetry();}
function subFrameRetry(){htmlRetryCount++;const iframe=$('#subIframe');if(!iframe)return;if(htmlRetryCount>3){try{if(iframe.contentWindow&&iframe.contentWindow.caches){iframe.contentWindow.caches.keys().then(names=>names.forEach(n=>iframe.contentWindow.caches.delete(n)));}else{let src=iframe.src;iframe.src='';setTimeout(()=>{iframe.src=src+'?_='+Date.now();},50);}}catch(e){let src=iframe.src;iframe.src='';setTimeout(()=>{iframe.src=src+'?_='+Date.now();},50);}htmlRetryCount=0;return;}let src=iframe.src;iframe.src='';setTimeout(()=>{iframe.src=src+(src.indexOf('?')>=0?'&':'?')+'_='+Date.now();},50);if(htmlRetryTimer)clearTimeout(htmlRetryTimer);htmlRetryTimer=setTimeout(subFrameRetry,1500);}
function reloadSubFrame(){htmlRetryCount=0;const iframe=$('#subIframe');if(!iframe)return;if(iframe.hasAttribute('srcdoc')){iframe.setAttribute('srcdoc',currentRawHtml.replace(/"/g,'&quot;'));}else{let src=iframe.src;iframe.src='';setTimeout(()=>{iframe.src=src+(src.indexOf('?')>=0?'&':'?')+'_='+Date.now();},50);}const reloadBtn=document.querySelector('.html-reload-btn');if(reloadBtn){reloadBtn.style.transform='rotate(360deg)';reloadBtn.style.transition='transform 0.5s';setTimeout(()=>{reloadBtn.style.transform='rotate(0deg)';},500);}}
function openImg(u){const im=$('.img-modal');im.querySelector("img").src=u;im.classList.add("active");}
function closeModal(sel){const el=$(sel);if(el)el.classList.remove("active");if(sel.indexOf('html-modal')>=0){htmlRetryCount=0;if(htmlRetryTimer){clearTimeout(htmlRetryTimer);htmlRetryTimer=null;}const b=$('.html-modal-body');if(b)b.innerHTML='';state.modalStack.pop();}}
document.addEventListener('DOMContentLoaded',()=>{
$('.modal-close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeModal('.modal');});
$('.html-modal-close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeModal('.html-modal');});
$('.modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('.modal');});
$('.html-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal('.html-modal');});
$('.img-modal').addEventListener('click',e=>{if(e.target===e.currentTarget||e.target.tagName==='IMG')closeModal('.img-modal');});
domObserver.observe(document.body,{childList:true,subtree:true});
mark('domReady');
});
window.print=function(){window.location.href="http://www.tianbin.net";};
Object.defineProperty(window,'outerHeight',{get:function(){return window.innerHeight;}});
Object.defineProperty(window,'outerWidth',{get:function(){return window.innerWidth;}});
document.addEventListener('keydown',e=>{
if(e.altKey&&e.key>='1'&&e.key<='5'){e.preventDefault();const idx=parseInt(e.key)-1;const navItem=(cfg.bottomNav||[])[idx];if(navItem)switchTab(navItem.id);}
if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();const inp=$('#secKey');if(inp){inp.focus();}}if(e.key==='Escape'){$$('.modal.active,.html-modal.active,.img-modal.active').forEach(el=>{if(el.classList.contains('modal'))closeModal('.modal');else if(el.classList.contains('html-modal'))closeModal('.html-modal');else closeModal('.img-modal');});}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register?.('/sw.js').catch(()=>{});}
loadConfig();
mark('initDone');
})();
</script>
