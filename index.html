t-size:16px;font-weight:600;margin-bottom:6px}.list-item .meta{font-size:13px;color:#718096}.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #e2e8f0;z-index:100}.mobile-nav button{flex:1;background:none;border:none;height:100%;font-size:12px;color:#718096;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.mobile-nav button.active{color:#4a9eff}.mobile-nav button span{font-size:18px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.2s}.modal.active{opacity:1;visibility:visible}.modal-box{background:#fff;width:90%;max-width:680px;max-height:85vh;border-radius:8px;display:flex;flex-direction:column;transform:scale(.95);transition:.2s}.modal.active .modal-box{transform:scale(1)}.modal-header{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:18px}.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:#999}.modal-body{padding:20px;overflow-y:auto}.modal-body .text{white-space:pre-line;line-height:1.8;margin-bottom:20px}.img-grid{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:8px}.img-grid img{border-radius:4px;aspect-ratio:1/1;object-fit:cover;cursor:pointer;flex-shrink:0;width:calc(33.333% - 6px);min-width:80px}.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.2s}.img-modal.active{opacity:1;visibility:visible}.img-modal img{max-width:95%;max-height:95%;object-fit:contain;cursor:pointer}.loading{padding:40px;text-align:center;color:#999}.pager{display:flex;justify-content:center;gap:10px;padding:15px}.pager button{padding:8px 16px;border:none;background:#4a9eff;color:#fff;border-radius:4px;cursor:pointer}.pager button:disabled{background:#ccc;cursor:not-allowed}.yo-search{display:flex;gap:10px;margin-bottom:15px}.yo-search input{flex:1;padding:10px;border:1px solid #ddd;border-radius:4px}.yo-search button{padding:10px 20px;background:#4a9eff;color:#fff;border:none;border-radius:4px;cursor:pointer}@media(max-width:768px){.pc-sidebar,.pc-header{display:none}.mobile-header,.mobile-nav{display:flex}.content-area{padding:15px 15px 70px}.modal-box{width:95%;max-height:80vh}.img-grid{width:100%}}.link{color:#4a9eff;cursor:pointer}.err{text-align:center;padding:40px;color:#e53e3e}</style><script>let cfg={},data={},cur="tianbin",yoPage=1,yoTotal=1,yoCache=[];const ban=e=>{e.preventDefault();location.href="http://www.tianbin.net"};document.addEventListener("contextmenu",ban);document.addEventListener("selectstart",ban);Object.defineProperty(document,"hidden",{get:()=>false});setInterval(()=>{if(document.hidden||window.outerHeight-document.documentElement.clientHeight>150)location.href="http://www.tianbin.net"},500);const fetchWithTimeout=(url,timeout=1000)=>Promise.race([fetch(url),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),timeout))]);fetchWithTimeout("https://api.tianbin.org/api/index.json").then(r=>r.json()).then(j=>{cfg=j;document.title=j.siteName;renderNav();const hash=location.hash.slice(1);if(hash&&cfg.sections.some(s=>s.id===hash))cur=hash;updateActive();loadData(cur)}).catch(()=>setTimeout(()=>location.reload(),1000));function renderNav(){const pcNav=document.querySelector(".pc-nav");pcNav.innerHTML=cfg.sections.map(s=>`<button data-id="${s.id}">${s.name}</button>`).join("");pcNav.onclick=e=>{const id=e.target.dataset.id;if(id){switchTab(id)}};const mbNav=document.querySelector(".mobile-nav");mbNav.innerHTML=cfg.sections.map(s=>`<button data-id="${s.id}"><span>${s.icon}</span>${s.name}</button>`).join("");mbNav.onclick=e=>{const id=e.target.closest("button").dataset.id;if(id){switchTab(id)}};updateActive()}function switchTab(id){cur=id;yoPage=1;updateActive();loadData(id);history.replaceState(null,null,`#${id}`)}window.addEventListener("hashchange",()=>{const hash=location.hash.slice(1);if(hash&&hash!==cur&&cfg.sections?.some(s=>s.id===hash)){cur=hash;updateActive();loadData(cur)}});function updateActive(){document.querySelectorAll(".pc-nav button,.mobile-nav button").forEach(btn=>{btn.classList.toggle("active",btn.dataset.id===cur)});document.querySelector(".mobile-header").textContent=cfg.sections.find(s=>s.id===cur)?.name||""}function loadData(id){const area=document.querySelector(".content-area");area.innerHTML='<div class="loading">拉取数据中...</div>';if(id!=='yo'){if(data[id]){renderList(data[id]);return}fetchWithTimeout(`https://api.tianbin.org/api/${id}.json`).then(r=>r.json()).then(j=>{data[id]=j;renderList(j)}).catch(()=>{area.innerHTML='<div class="err">正在刷新网页拉取数据</div>';setTimeout(()=>location.reload(),400)});return}if(yoCache.length){renderYoList();return}fetchWithTimeout("https://api.tianbin.org/api/yo.json").then(r=>r.json()).then(j=>{yoCache=j;j.sort((a,b)=>new Date(b.date)-new Date(a.date));renderYoList()}).catch(()=>{area.innerHTML='<div class="err">正在刷新网页拉取数据</div>';setTimeout(()=>location.reload(),400)})}function renderYoList(){const area=document.querySelector(".content-area");const list=yoCache;yoTotal=Math.ceil(list.length/10);let html=`<div class="yo-search"><input id="yoKey" placeholder="输入ID号或角色名"><button onclick="yoSearch()">查询</button></div>`;const start=(yoPage-1)*10,end=start+10;list.slice(start,end).forEach((it,i)=>{html+=`<div class="list-item" onclick="openModal(${start+i})"><div class="title">${it.title}</div><div class="meta">${it.date} · ${it.author}</div></div>`});html+=`<div class="pager"><button onclick="yoPrev()" ${yoPage<=1?'disabled':''}>上一页</button><span style="line-height:36px">${yoPage}/${yoTotal}</span><button onclick="yoNext()" ${yoPage>=yoTotal?'disabled':''}>下一页</button></div>`;area.innerHTML=html}function yoSearch(){const k=document.getElementById("yoKey").value.trim();if(!k){renderYoList();return}const f=yoCache.filter(i=>/^\d+$/.test(k)?i.author===k:i.title.includes(k));const area=document.querySelector(".content-area");area.innerHTML=f.length?f.map((it,i)=>`<div class="list-item" onclick="openModal(${yoCache.indexOf(it)})"><div class="title">${it.title}</div><div class="meta">${it.date} · ${it.author}</div></div>`).join("")+'<div class="pager"><button onclick="loadData(\'yo\')">返回</button></div>':'<div class="err">未登记</div><div class="pager"><button onclick="loadData(\'yo\')">返回</button></div>'}function yoPrev(){if(yoPage>1){yoPage--;renderYoList()}}function yoNext(){if(yoPage<yoTotal){yoPage++;renderYoList()}}function renderList(items){const area=document.querySelector(".content-area");area.innerHTML=items.length?items.map((it,i)=>`<div class="list-item" onclick="openModal(${i})"><div class="title">${it.title}</div><div class="meta">${it.date} · ${it.author}</div></div>`).join(""):'<div class="err">正在刷新网页拉取数据</div>'}function openModal(idx){const item=cur==='yo'?yoCache[idx]:data[cur][idx];const body=document.querySelector(".modal-body");body.innerHTML=`<div class="text">${item.content.replace(/\\n/g,"<br>").replace(/\\t([^\\n]+)/g,'<a href="$1" target="_blank" class="link">$1</a>')}</div>${item.imgs?.slice(0,9).map(u=>`<div class="img-grid"><img src="${u}" onclick="openImg('${u}')"></div>`).join("")||""}`;document.querySelector(".modal-header h3").textContent=item.title;document.querySelector(".modal").classList.add("active");document.querySelector(".modal-close").onclick=()=>document.querySelector(".modal").classList.remove("active");}function openImg(u){const im=document.querySelector(".img-modal");im.querySelector("img").src=u;im.classList.add("active");im.onclick=()=>im.classList.remove("active");}document.querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("active")};window.onload=()=>document.addEventListener("keydown",e=>{if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&e.key==="I"))ban(e)})</script></head><body><div id="app"><div class="pc-layout"><div class="pc-sidebar"><div class="logo">天彬</div><div class="pc-nav"></div></div><div class="main-content"><div class="mobile-header"></div><div class="content-area"></div></div></div><div class="mobile-nav"></div><div class="modal"><div class="modal-box"><div class="modal-header"><h3></h3><button class="modal-close">&times;</button></div><div class="modal-body"></div></div></div><div class="img-modal"><img></div></div></body></html>
